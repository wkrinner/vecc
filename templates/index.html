<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Escenarios de Cambio Climático</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0"></script>
</head>
<body>
    <div id="map" style="width: 100%; height: 98vh;">    
        <div id="chartContainer" class="chart-container" style="display: none;">
            <button id="closeChartButton" class="close-chart-button">x</button>
            <canvas id="timeSeriesChart"></canvas>
        </div>
        <div class="controls">
            <div class="dropdown-row">
                <label for="yearSelector">Año:</label>
                <select id="yearSelector"></select>
            </div>
            <div class="dropdown-row">
                <label for="scenarioSelector">Escenario:</label>
                <select id="scenarioSelector"></select>
            </div>
            <div class="dropdown-row">
                <label for="variableSelector">Variable:</label>
                <select id="variableSelector"></select>
            </div>
            <div class="dropdown-row">
                <label for="seasonSelector">Estación:</label>
                <select id="seasonSelector"></select>
            </div>
            <h4>Capas:</h4> 
            <div class="layer-option">
                <label for="toggleLayerRios">Ríos</label>
                <input type="checkbox" id="toggleLayerRios">
            </div>
            <div class="layer-option">
                <label for="toggleLayerCarreteras">Carreteras</label>
                <input type="checkbox" id="toggleLayerCarreteras">
            </div>                     
            <div class="layer-option">
                <label for="toggleLayerDepartamentos">Departamentos </label>
                <input type="checkbox" id="toggleLayerDepartamentos">
            </div>
            <div class="layer-option">
                <label for="toggleLayerAAA">Ámbitos AAA</label>
                <input type="checkbox" id="toggleLayerAAA">
            </div>
            <div class="layer-option">
                <label for="toggleLayerRepresas">Represas</label>
                <input type="checkbox" id="toggleLayerRepresas">
            </div>
            <div class="layer-option">
                <label for="toggleLayerFuentes">Fuentes</label>
                <input type="checkbox" id="toggleLayerFuentes">
            </div>
        </div>
        <!--div class="type-selector">
            <label for="typeSelector">Tipo de dato:</label>
            <select id="typeSelector"></select>
        </div-->
        <div id="typeSelector" class="type-selector"></div>
    </div>    
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
